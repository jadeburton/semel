name: Swift

# Runs on a self-hosted macOS runner (docs/ci.md): the machine's own Xcode, simulator
# runtimes and SwiftLint, and no billed minutes. A change that touches only documentation
# or the backlog runs nothing. A newer push to the same branch cancels the run in flight.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # What this machine builds with, so a failure can be read against it.
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes | grep -i ios || true

      # scripts/build.sh is swift build/test with --disable-build-manifest-caching. The
      # runner is self-hosted, so .build survives between runs, and SwiftPM's cached plan
      # takes its inputs from the root package alone: a file added to or removed from any
      # of the path-dependency packages would be invisible to the build that follows it.
      - name: Build
        run: scripts/build.sh -c release

      # Every package is tested. The engine lives in its own package and the toolchains in
      # theirs, so a green run of any one of them covers well under half the suite.
      - name: Test SemelNodeKit
        run: scripts/build.sh test --package-path SemelNodeKit

      - name: Test SemelProtocol
        run: scripts/build.sh test --package-path SemelProtocol

      - name: Test SemelSwift
        run: scripts/build.sh test --package-path SemelSwift

      - name: Test SemelClang
        run: scripts/build.sh test --package-path SemelClang

      - name: Test SemelApple
        run: scripts/build.sh test --package-path SemelApple

      - name: Test SemelExamples
        run: scripts/build.sh test --package-path SemelExamples

      - name: Test SemelCore
        run: scripts/build.sh test --package-path SemelCore

      # The root package's tests include SemelEndToEndTests, which builds the C, C++
      # and Swift fixtures under EndToEnd/Fixtures through semelserv, semel and
      # semel-swift, twice each. External projects are not run here; see end-to-end.yml.
      - name: Test the CLI, the server and the end-to-end fixtures
        run: scripts/build.sh test

  # A separate job so a lint finding and a test failure show up as two red marks, not one.
  # `--strict` because the rule set in .swiftlint.yml is small and curated: every finding is
  # a real defect of the kind that has cost this codebase before, so it fails the build
  # rather than filing a report nobody reads. Formatting is out of scope here. SwiftLint is
  # installed on the runner (docs/ci.md); the runner's service PATH may not include
  # Homebrew, hence the explicit path.
  lint:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: |
          SWIFTLINT="$(command -v swiftlint || echo /opt/homebrew/bin/swiftlint)"
          "$SWIFTLINT" version
          "$SWIFTLINT" --strict
