name: Swift

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Build
        run: swift build -c release

      # Every package is tested. The engine lives in its own package and the toolchains in
      # theirs, so a green run of any one of them covers well under half the suite — before
      # this, CI ran only the engine's tests and would not have noticed a broken toolchain
      # at all.
      - name: Test SemelNodeKit
        run: swift test --package-path SemelNodeKit

      - name: Test SemelProtocol
        run: swift test --package-path SemelProtocol

      - name: Test SemelSwift
        run: swift test --package-path SemelSwift

      - name: Test SemelClang
        run: swift test --package-path SemelClang

      - name: Test SemelApple
        run: swift test --package-path SemelApple

      - name: Test SemelExamples
        run: swift test --package-path SemelExamples

      - name: Test SemelCore
        run: swift test --package-path SemelCore

      # The root package's tests include SemelEndToEndTests, which builds the C, C++
      # and Swift fixtures under EndToEnd/Fixtures through semelserv, semel and
      # semel-swift, twice each. External projects are not run here; see end-to-end.yml.
      - name: Test the CLI, the server and the end-to-end fixtures
        run: swift test

  # A separate job so a lint finding and a test failure show up as two red marks, not one.
  # `--strict` because the rule set in .swiftlint.yml is small and curated: every finding is
  # a real defect of the kind that has cost this codebase before, so it fails the build
  # rather than filing a report nobody reads. Formatting is out of scope here.
  lint:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint --strict
