name: Swift

# Runs on a self-hosted macOS runner (docs/ci.md): the machine's own Xcode, simulator
# runtimes and SwiftLint, and no billed minutes. A change that touches only documentation
# or the backlog runs nothing. A newer push to the same branch cancels the run in flight.
# Every push and pull request, documentation included: the `main` ruleset requires
# `build-and-test` and `lint` to pass, and a check that never reports on a docs-only
# change would leave that change unmergeable by anyone without bypass.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GitHub's hosted macOS image, not the project's own Mac: this workflow runs a pull
# request's code, and on a public repository that is a stranger's code. Hosted runners
# are free for a public repository, and the trial (`hosted-runner-trial.yml`) showed the
# image builds this repository and passes its suites. The nightly, which nobody outside
# can trigger, stays on the self-hosted runner (end-to-end.yml).
jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # What this machine builds with, so a failure can be read against it.
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes | grep -i ios || true

      # scripts/build.sh is swift build/test with --disable-build-manifest-caching, which
      # makes SwiftPM plan every invocation instead of reusing a plan whose inputs come from
      # the root package alone (AGENTS.md, "Why the wrapper"). Each run here starts from a
      # clean checkout and plans anyway (docs/ci.md), so the flag changes nothing about what
      # CI does and costs it nothing. It is here so that there is one build command: CI runs
      # what the documentation tells a contributor to run, and a step cannot drift from it.
      - name: Build
        run: scripts/build.sh -c release

      # Every package is tested. The engine lives in its own package and the toolchains in
      # theirs, so a green run of any one of them covers well under half the suite.
      - name: Test SemelNodeKit
        run: scripts/build.sh test --package-path SemelNodeKit

      - name: Test SemelProtocol
        run: scripts/build.sh test --package-path SemelProtocol

      - name: Test SemelSwift
        run: scripts/build.sh test --package-path SemelSwift

      - name: Test SemelClang
        run: scripts/build.sh test --package-path SemelClang

      - name: Test SemelApple
        run: scripts/build.sh test --package-path SemelApple

      - name: Test SemelExamples
        run: scripts/build.sh test --package-path SemelExamples

      - name: Test SemelCore
        run: scripts/build.sh test --package-path SemelCore

      # The root package's tests include SemelEndToEndTests, which builds the C, C++
      # and Swift fixtures under EndToEnd/Fixtures through semelserv, semel and
      # semel-swift, twice each. External projects are not run here; see end-to-end.yml.
      - name: Test the CLI, the server and the end-to-end fixtures
        run: scripts/build.sh test

      # A test process that dies of a signal leaves its stack in a crash report, which a
      # hosted runner discards with the machine. Kept when the job fails, so the next
      # unexplained crash has a report to read; nothing is uploaded from a green run.
      - name: Keep crash reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crash-reports-${{ github.run_id }}
          path: |
            ~/Library/Logs/DiagnosticReports/*.ips
            ~/Library/Logs/DiagnosticReports/*.crash
          if-no-files-found: ignore

  # A separate job so a lint finding and a test failure show up as two red marks, not one.
  # `--strict` because the rule set in .swiftlint.yml is small and curated: every finding is
  # a real defect of the kind that has cost this codebase before, so it fails the build
  # rather than filing a report nobody reads. Formatting is out of scope here.
  lint:
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The hosted image may or may not ship SwiftLint; when it does not, Homebrew has it.
      - name: Lint
        run: |
          if ! command -v swiftlint > /dev/null; then
            brew install swiftlint
          fi
          swiftlint version
          swiftlint --strict
