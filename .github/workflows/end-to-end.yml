name: End-to-end

# Real projects pinned by commit, through both binaries, twice each. Nightly on main and
# on demand; too slow and too network-bound for every pull request, which runs the
# fixtures instead (swift.yml). Runs on the self-hosted macOS runner (docs/ci.md), where
# the clone cache under ~/Library/Caches/semel/end-to-end persists between runs on its
# own: the harness keys a clone on the roster's pinned commit, so a pin change refetches.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  external-projects:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Build
        run: scripts/build.sh

      - name: Build the external projects twice each
        env:
          SEMEL_E2E_EXTERNAL: "1"
          SEMEL_E2E_KEEP: "1"
        run: scripts/build.sh test --filter SemelEndToEndTests

      - name: Keep the run roots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: semel-e2e-roots
          path: /tmp/semel-tests
          if-no-files-found: ignore

      # The kept roots are gigabytes each; on a machine that is also a workstation they
      # do not accumulate. The artifact above is the copy that survives.
      - name: Remove the run roots
        if: always()
        run: rm -rf /tmp/semel-tests
