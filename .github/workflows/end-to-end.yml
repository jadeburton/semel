name: End-to-end

# Real projects pinned by commit, through both binaries, twice each. Nightly on main and
# on demand; too slow and too network-bound for every pull request, which runs the
# fixtures instead (swift.yml). Runs on the self-hosted macOS runner (docs/ci.md), where
# the clone cache under ~/Library/Caches/semel/end-to-end persists between runs on its
# own: the harness keys a clone on the roster's pinned commit, so a pin change refetches.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  external-projects:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Build
        run: scripts/build.sh

      # The run roots go under a folder of this run's own, not the harness's default
      # `/tmp/semel-tests`: the runner is also a workstation, and a developer's or an
      # agent's own end-to-end run under the default would share it with this one — the
      # cleanup below once removed such a folder under a live run and failed on the files
      # it kept writing. Short, because sockets live under it.
      - name: Build the external projects twice each
        env:
          SEMEL_E2E_EXTERNAL: "1"
          SEMEL_E2E_KEEP: "1"
          SEMEL_E2E_ROOT: /tmp/semel-e2e-${{ github.run_id }}
        run: scripts/build.sh test --filter SemelEndToEndTests

      # As one archive: the roots hold vendored dependencies whose documentation names
      # files with characters the artifact store refuses (`!=(_:_:).json` in Bodega), and
      # an upload that stops at one such name keeps nothing.
      - name: Archive the run roots on failure
        if: failure()
        run: |
          if [ -d /tmp/semel-e2e-${{ github.run_id }} ]; then
            tar -czf /tmp/semel-e2e-roots.tgz -C /tmp semel-e2e-${{ github.run_id }}
          fi

      - name: Keep the run roots on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semel-e2e-roots
          path: /tmp/semel-e2e-roots.tgz
          if-no-files-found: ignore

      # The kept roots are gigabytes each; on a machine that is also a workstation they
      # do not accumulate. The artifact above is the copy that survives; the archive it
      # was made from goes too, or a failed run leaves it on the disk until someone finds it.
      - name: Remove the run roots
        if: always()
        run: rm -rf /tmp/semel-e2e-${{ github.run_id }} /tmp/semel-e2e-roots.tgz
