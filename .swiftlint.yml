# SwiftLint configuration (B-46).
#
# A curated set, not the default one. Every rule here catches a class of small waste that
# has actually cost this codebase something — `contains_over_filter_is_empty` is exactly
# the defect 9019d50 fixed by hand in Folder.canBeDeleted, which built a whole array on a
# path the collector walks per tree level instead of stopping at the first objection.
#
# Stylistic rules (line length, brace placement, whitespace, naming, body lengths) are
# deliberately off: on a codebase this size they produce the bulk of the noise and none of
# the value, and a wall of warnings nobody triages trains people to ignore the tool.
#
# force_unwrapping, force_try and force_cast are on, with no exemptions. A force is a
# decision to crash on a state the code claims is impossible, made silently, at a place a
# reader has to recognise as one. The code says such a state instead: a `guard` or a
# throwing accessor with a typed error naming what was missing (`NodeRecord.requireID()`,
# the file-system nodes' `path`), and where a crash really is the right outcome, the
# explicit fatal path (`FatalErrors`) rather than a bare `!`.
#
# CI runs `swiftlint --strict`, so every finding fails the build. That is the right mode for
# a set this small: a report nobody reads is the failure mode this file exists to avoid.
# Formatting (swift-format, autocorrect) is out of scope.

only_rules:
  # Walking a whole collection to answer a yes/no question.
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_count
  - first_where
  - last_where
  - sorted_first_last
  - reduce_boolean
  - flatmap_over_map_reduce
  # Bindings and parameters that are declared and never read.
  - unused_optional_binding
  - unused_closure_parameter
  # Code that says nothing.
  - implicit_optional_initialization
  - unneeded_break_in_switch
  # Crashing on a state the code claims impossible, instead of saying it.
  - force_unwrapping
  - force_try
  - force_cast

# Two other lists name the same packages by hand and must be kept in step with this one:
# `Semel.xcworkspace/contents.xcworkspacedata` (the FileRefs) and
# `.github/workflows/swift.yml` (the per-package `Test …` steps). `SemelDatabaseModels`
# has no `Tests` directory, so it has no `/Tests` entry here and no step there.
included:
  - SemelNodeKit/Sources
  - SemelNodeKit/Tests
  - SemelProtocol/Sources
  - SemelProtocol/Tests
  - SemelDatabaseModels/Sources
  - SemelCore/Sources
  - SemelCore/Tests
  - SemelSwift/Sources
  - SemelSwift/Tests
  - SemelClang/Sources
  - SemelClang/Tests
  - SemelApple/Sources
  - SemelApple/Tests
  - SemelExamples/Sources
  - SemelExamples/Tests
  - semel
  - semel-watch
  - semel-monitor
  - EndToEnd/Tests

excluded:
  - "**/.build"
  - .claude
  - .swiftpm
  - docs
